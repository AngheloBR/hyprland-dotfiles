# ============================================================
#  hyprland.conf – Anghelo / Tokyo Night
#  CachyOS + Hyprland (sintaxis actual)
# ============================================================

monitor=,preferred,auto,1

# ── Autostart ───────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = swww img ~/Pictures/wallpapers/default.jpg
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle

# ── Entorno ─────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,gtk3
env = GDK_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# ── Aspecto ─────────────────────────────────────────────────
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
  col.inactive_border = rgba(1a1b26aa)
  layout = dwindle
  resize_on_border = true
}

decoration {
  rounding = 10
  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    noise = 0.02
    brightness = 0.9
    popups = true
  }
  shadow {
    enabled = true
    range = 15
    render_power = 3
    color = rgba(1a1b2699)
  }
  dim_inactive = true
  dim_strength = 0.05
}

animations {
  enabled = true
  bezier = smooth,   0.05, 0.9,  0.1,  1.05
  bezier = snappy,   0.25, 1.0,  0.5,  1.0
  bezier = linear,   0.0,  0.0,  1.0,  1.0
  bezier = overshot, 0.13, 0.99, 0.29, 1.1
  animation = windows,     1, 5,  smooth,  slide
  animation = windowsOut,  1, 4,  snappy,  slide
  animation = border,      1, 10, default
  animation = borderangle, 1, 8,  linear,  loop
  animation = fade,        1, 4,  default
  animation = workspaces,  1, 5,  overshot, slidevert
}

dwindle {
  preserve_split = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  animate_manual_resizes = true
  enable_swallow = true
  swallow_regex = ^(ghostty)$
}

# ── Input ───────────────────────────────────────────────────
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0
  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

# ── Keybinds ────────────────────────────────────────────────
$mod = SUPER

bind = $mod,       T, exec, ghostty
bind = $mod,       R, exec, rofi -show drun
bind = $mod SHIFT, R, exec, rofi -show run
bind = $mod,       E, exec, ghostty -e yazi
bind = $mod,       B, exec, firefox
bind = $mod,       V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

bind = $mod,       Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod,       F, fullscreen
bind = $mod SHIFT, F, togglefloating
bind = $mod,       P, pseudo

bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u
bind = $mod, J,     movefocus, d
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, J,     movewindow, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

binde = $mod CTRL, H, resizeactive, -30 0
binde = $mod CTRL, L, resizeactive,  30 0
binde = $mod CTRL, K, resizeactive,  0 -30
binde = $mod CTRL, J, resizeactive,  0  30

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = ,      Print, exec, screenshot.sh screen
bind = SHIFT, Print, exec, screenshot.sh region
bind = $mod,  Print, exec, screenshot.sh window

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mod SHIFT, E, exec, wlogout

# ── Reglas de ventanas ───────────────────────────────────────
windowrulev2 = float, class:(pavucontrol)
windowrulev2 = float, class:(nm-connection-editor)
windowrulev2 = float, title:(Picture-in-Picture)
windowrulev2 = size 800 600, class:(pavucontrol)
windowrulev2 = center, class:(pavucontrol)
windowrulev2 = float, class:(ghostty-float)
windowrulev2 = size 700 400, class:(ghostty-float)
windowrulev2 = center, class:(ghostty-float)
