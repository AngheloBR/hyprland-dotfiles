# hyprlock.conf – pantalla de bloqueo Tokyo Night

background {
  monitor =
  path = ~/Pictures/wallpapers/default.jpg
  blur_passes = 3
  blur_size = 7
  brightness = 0.6
}

input-field {
  monitor =
  size = 280, 50
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.2
  outer_color = rgba(7aa2f7ff)
  inner_color = rgba(1a1b26cc)
  font_color = rgba(c0caf5ff)
  fade_on_empty = true
  placeholder_text = <span foreground="##c0caf5">Password...</span>
  hide_input = false
  position = 0, -100
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = rgba(c0caf5ff)
  font_size = 72
  font_family = JetBrainsMono Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] echo "$(date +"%A, %d %B")"
  color = rgba(7aa2f7bb)
  font_size = 18
  font_family = JetBrainsMono Nerd Font
  position = 0, 120
  halign = center
  valign = center
}
